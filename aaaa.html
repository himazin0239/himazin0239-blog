
<div class="main-left-grid">
    <div class="scratch-container">
  
      <div class="scratch-header">
        <span id="text">Roblox</span>
        <span id="austiblox-status">[ Loading... ]</span>
      </div>
  
      <img
        src="https://austiblox.net/render/user/41/41614.png"
        width="100"
        referrerpolicy="no-referrer"
      >
  
    </div>
  </div>
  
  <script>
    // Roblox → Austiblox の切り替え
    const textElement = document.getElementById("text");
  
    textElement.addEventListener("mouseenter", () => {
      textElement.textContent = "Austiblox";
    });
  
    textElement.addEventListener("mouseleave", () => {
      textElement.textContent = "Roblox";
    });
  
    // Austibloxのオンライン状態を取得
    const statusElement = document.getElementById(
      "austiblox-status"
    );
  
    async function updateAustibloxStatus() {
      try {
        const response = await fetch("/api/austiblox-status");
  
        if (!response.ok) {
          throw new Error("API request failed");
        }
  
        const data = await response.json();
  
        statusElement.textContent = data.status;
  
      } catch (error) {
        console.error("Austiblox status:", error);
  
        statusElement.textContent = "[ Status unavailable ]";
      }
    }
  
    // 最初の取得
    updateAustibloxStatus();
  
    // 60秒ごとに更新
    setInterval(updateAustibloxStatus, 60000);
  </script>
